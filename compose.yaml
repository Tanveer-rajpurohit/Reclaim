services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: reclaim
      POSTGRES_PASSWORD: reclaim-local-only
      POSTGRES_DB: reclaim
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - reclaim-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reclaim -d reclaim"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reclaim-postgres:
