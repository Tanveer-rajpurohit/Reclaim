name: Verify Reclaim
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: reclaim
          POSTGRES_PASSWORD: reclaim-ci-only
          POSTGRES_DB: reclaim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reclaim -d reclaim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://reclaim:reclaim-ci-only@127.0.0.1:5432/reclaim
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend db:generate
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm --filter web test:e2e
      - run: pnpm check-types
      - run: pnpm lint
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/web/test-results
          retention-days: 7
